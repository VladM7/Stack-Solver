name: CodeQL

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analyze (C#)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.sln
            **/*.slnx
            **/*.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build (each csproj)
        shell: pwsh
        run: |
          # Build the .csproj projects directly. Autobuild/the .slnx pull in
          # Package\Stack-Solver.Package.wapproj, which needs a Windows SDK that
          # isn't on the CodeQL runner (APPX3217). CodeQL only needs the C# code.
          $projects = Get-ChildItem -Recurse -Filter *.csproj -File
          if (-not $projects) { Write-Host "No csproj files found"; exit 1 }
          foreach ($p in $projects) {
            echo "Restoring $($p.FullName)"
            dotnet restore --nologo "$($p.FullName)"
          }
          foreach ($p in $projects) {
            echo "Building $($p.FullName)"
            dotnet build "$($p.FullName)" --configuration Release --no-restore /p:ContinuousIntegrationBuild=true
          }

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:csharp'
